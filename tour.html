<!DOCTYPE html>
<html>
<head>
    <title>Virtual Tour</title>
</head>

<body bgcolor="white">

<center>
    <h3>Virtual Art Exhibition Tour</h3>

    <video id="artVideo" width="500" controls>
        <source src="video/exhibition.mp4" type="video/mp4">
        Your browser does not support the video tag.
    </video>

    <br>

    <audio id="bgMusic">
        <source src="audio/music.mp3" type="audio/mpeg">
        Your browser does not support the audio element.
    </audio>
</center>

<!-- Paste the script here -->
<script>
    var video = document.getElementById("artVideo");
    var audio = document.getElementById("bgMusic");

    video.onplay = function () {
        audio.currentTime = 0;
        audio.play();
    };

    video.onpause = function () {
        audio.pause();
    };

    video.onended = function () {
        audio.pause();
        audio.currentTime = 0;
    };

    audio.ontimeupdate = function () {
        if (audio.currentTime >= 51) {
            audio.pause();
            audio.currentTime = 0;
        }
    };
</script>


</body>
</html>
